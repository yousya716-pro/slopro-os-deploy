name: Field Reference Static Audit
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production field research shell
        run: |
          set -euo pipefail
          test -f field-reference-rollout-v1.css
          test -f index.html
          test -f sw.js
          python3 - <<'PY'
          from pathlib import Path
          html=Path("index.html").read_text()
          sw=Path("sw.js").read_text()
          css=Path("field-reference-rollout-v1.css").read_text()
          assert chr(92)+"n" not in html, "literal backslash-n found in index.html"
          assert '<link rel="stylesheet" href="./field-reference-rollout-v1.css">' in html
          assert '<script src="./app.js"></script>' in html
          assert 'field-reference-v5.js' not in html
          assert 'field-reference-v12.css' not in html
          assert 'field-carousel-v25.css' not in html
          assert "'./field-reference-rollout-v1.css'" in sw
          assert "'./app.js'" in sw
          assert "slopro-public-shell-v40-field-reference-rollout-private" in sw
          assert "calc(66.6667% - 4px)" in css
          assert "scroll-snap-type:x mandatory" in css
          assert "scroll-snap-stop:normal" in css
          assert "touch-action:pan-x pan-y" in css
          assert ".fr-morning" in css and ".zone-matrix" in css and ".at-matrix" in css
          print("FIELD_REFERENCE_STATIC_AUDIT_OK")
          PY
