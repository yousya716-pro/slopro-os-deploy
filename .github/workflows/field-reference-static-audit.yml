name: Field Reference Static Audit
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production field research shell
        run: |
          node --check field-reference.js
          python3 - <<'PY'
          from pathlib import Path
          html=Path("index.html").read_text()
          sw=Path("sw.js").read_text()
          assert chr(92)+"n" not in html, "literal backslash-n found in index.html"
          assert '<script src="./field-reference.js?v=' in html
          assert '<link rel="stylesheet" href="./field-reference-v9.css' in html
          assert "'./field-reference.js'" in sw
          assert "'./field-reference-v9.css'" in sw
          js=Path("field-reference.js").read_text()
          css=Path("field-reference-v9.css").read_text()
          assert "display_summary||''" in js, "undefined-safe field text guard missing"
          assert "phase==='normal'" in js, "normal phase parser missing"
          assert "strategy_type===kind" in js, "strategy type parser missing"
          assert "前回AT枚数 200～1000枚" in js, "Tokyo Ghoul case parser missing"
          assert "ghoul-data" in js, "numeric decision table renderer missing"
          assert "ghoul-cz-strip" in js and "ghoul-at-full" in js, "full-width case renderer missing"
          assert "atGrouped" in js and "atCompact" in js, "grouped AT renderer missing"
          assert "データ読込異常" in js, "empty-table fail-close missing"
          assert "fr-rail" in js and "bindDrawer" in js, "persistent machine rail missing"
          assert "fr-rail-machine" in css and "flex-wrap:wrap" in css, "persistent rail/wrap CSS missing"
          assert "iPhone density pass" in css, "iPhone density profile missing"
          assert "grid-template-columns:1fr!important" in css, "mobile case stack guard missing"
          assert "overflow-x:hidden" in css, "horizontal overflow guard missing"
          assert "flex:0 0 60%!important" in css and "width:60%!important" in css and "max-width:60%!important" in css, "60 percent two-screen carousel contract missing"
          assert "morning-tables" in js and "morning-block" in js, "morning table renderer missing"
          assert "250以内" in js and "250以上" in js and "480G〜" in js, "explicit morning matrix missing"
          assert "原文が「以内／以上」で重複" in js, "morning overlap warning missing"
          assert ".morning-tables" in css and ".morning-zone" in css and ".morning-at" in css, "morning table CSS missing"
          assert "transform:none!important" in css and "width:100%!important" in css, "morning alignment isolation missing"
          print("FIELD_REFERENCE_STATIC_AUDIT_OK")
          PY
