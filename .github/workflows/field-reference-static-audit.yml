name: Field Reference Static Audit
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production field research shell
        run: |
          set -euo pipefail
          test -f field-reference-rollout-v6.css
          test -f index.html
          test -f sw.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          feed=json.loads(Path("vegas-number-floor-current.json").read_bytes())
          assert feed["schema"]=="SLOPRO_VEGAS_NUMBER_FLOOR_CURRENT_V1"
          assert set(feed)=={"schema","store_id","provider","scope","report_date","checked_at_utc","source_url","number_count","models","current_on_site_verified"}
          assert feed["store_id"]=="shinjuku_southeast" and feed["provider"]=="SLO_NAVI"
          assert feed["scope"]=="46_OWNER_NUMBER_REFERENCE" and feed["current_on_site_verified"] is False
          rows=[r for m in feed["models"] for r in m["numbers"]]
          assert len(rows)==len({r["number"] for r in rows})==feed["number_count"]==446
          assert all(set(m)=={"public_name","machine_index","model_id","numbers"} for m in feed["models"])
          assert all(set(r)=={"number","floor_id"} for r in rows)
          import json
          feed=json.loads(Path("vegas-number-floor-current.json").read_bytes())
          assert feed["schema"]=="SLOPRO_VEGAS_NUMBER_FLOOR_CURRENT_V1"
          assert set(feed)=={"schema","store_id","provider","scope","report_date","checked_at_utc","source_url","number_count","models","current_on_site_verified"}
          assert feed["store_id"]=="shinjuku_southeast" and feed["provider"]=="SLO_NAVI"
          assert feed["scope"]=="46_OWNER_NUMBER_REFERENCE" and feed["current_on_site_verified"] is False
          rows=[r for m in feed["models"] for r in m["numbers"]]
          assert len(rows)==len({r["number"] for r in rows})==feed["number_count"]==446
          assert all(set(m)=={"public_name","machine_index","model_id","numbers"} for m in feed["models"])
          assert all(set(r)=={"number","floor_id"} for r in rows)
          other=json.loads(Path("other-store-number-floors-current.json").read_bytes())
          assert set(other)=={"schema","stores"} and other["schema"]=="SLOPRO_OTHER_STORE_NUMBER_FLOORS_V1"
          assert [s["number_count"] for s in other["stores"]]==[749,269,240]
          assert all(r["floor_id"] is None for m in other["stores"][2]["models"] for r in m["numbers"])
          import base64,hashlib
          images=list(Path("floor-images").glob("*.json"))
          assert {p.stem for p in images}==set(["kabuki-b1","kabuki-2","kabuki-3","kabuki-4","kabuki-new2","seibu-3","seibu-4","vegas-1","vegas-b1","vegas-b2","vegas-b3","kaleido-1","kaleido-2"])
          for p in images:
              image=json.loads(p.read_bytes())
              assert image["schema"]=="SLOPRO_RUNTIME_FLOOR_IMAGE_V1" and image["key"]==p.stem
              assert image["current_on_site_verified"] is False and image["geometry_verified"] is True and image["image_content_updated_at"] is None
              raw=base64.b64decode(image["image_base64"],validate=True)
              assert raw[:3]==bytes([255,216,255]) and len(raw)<=500000 and hashlib.sha256(raw).hexdigest()==image["image_sha256"]
          html=Path("index.html").read_text()
          sw=Path("sw.js").read_text()
          css=Path("field-reference-rollout-v6.css").read_text()
          assert chr(92)+"n" not in html, "literal backslash-n found in index.html"
          assert '<link rel="stylesheet" href="./field-reference-rollout-v6.css">' in html
          assert '<script src="./app-sheet-priority-20261004.js"></script>' in html
          assert '<script src="./source-zero-memo-20261005.js"></script>' in html
          assert '<link rel="stylesheet" href="./source-zero-memo-20261005.css">' in html
          assert '<script src="./field-target-ui-v5.js"></script>' in html
          assert "'./field-target-ui-v5.js'" in sw
          assert 'field-reference-v5.js' not in html
          assert 'field-reference-v12.css' not in html
          assert 'field-carousel-v25.css' not in html
          assert "'./field-reference-rollout-v6.css'" in sw
          assert "'./app-sheet-priority-20261004.js'" in sw
          assert "slopro-public-shell-v86-sap-evening20" in sw
          assert "calc(66.6667% - 4px)" in css
          assert "scroll-snap-type:x mandatory" in css
          assert "scroll-snap-stop:normal" in css
          assert "touch-action:pan-x pan-y" in css
          assert ".fr-morning" in css and ".at-matrix" in css
          assert ".fr-rail-machine" in css and ".field-machine-main" in css
          for asset in ["morning-postplay-20261005.css", "source-reference-single-20261011.js"]:
              assert asset in html and asset in sw and Path(asset).is_file()
          for asset in ["morning-postplay-20261005.css", "source-reference-single-20261011.js"]:
              assert asset in html and asset in sw and Path(asset).is_file()
          for asset in ["morning-postplay-20261005.css", "source-reference-single-20261011.js"]:
              assert asset in html and asset in sw and Path(asset).is_file()
          assert "morning-opening-ev-20261005.css" in html and "morning-opening-ev-20261005.css" in sw and Path("morning-opening-ev-20261005.css").is_file()
          assert "source-reference-links-20261011.css" in html and "source-reference-links-20261011.css" in sw and Path("source-reference-links-20261011.css").is_file()
          app=Path("app-sheet-priority-20261004.js").read_text()
          assert "fr-rail-machine" in app and "pwa-field-reference-api" in app
          assert "__SLOPRO_ORIGINAL_SOURCE_REFERENCE__" in app
          assert "catalog_version:5" in app
          assert "include_store_maps:true" in app
          for asset in ["fox-quick-reference-20261003.css", "four-store-maps-number-floor-20261004.js", "four-store-maps-header-compact-20261003.css", "patrol-ceiling-20261002.css"]:
              assert asset in html and asset in sw and Path(asset).is_file()
          map_images=list(Path(".").glob("fourmaps-*-20261002.jpg"))
          assert len(map_images)==12
          assert all("./"+p.name in sw for p in map_images)
          for asset in ["fox-quick-reference-20261003.css", "received-fox-source-20261003.css", "all-targets-sheet-priority-20261004.js", "all-targets-reference-20261002.css"]:
              assert asset in html and asset in sw and Path(asset).is_file()
          for asset in ["fox-quick-reference-20261003.css", "original-source-reference-received-fox-20261003.js", "carousel-source-diagnostic-20261002.js", "original-source-reference-20261002-dense.css"]:
              assert asset in html and asset in sw and Path(asset).is_file()
          assert "スルー" not in css, "decision/source text must not be hardcoded in presentation CSS"
          print("FIELD_REFERENCE_STATIC_AUDIT_OK")
          PY
