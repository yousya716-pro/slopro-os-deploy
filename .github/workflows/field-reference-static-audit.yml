name: Field Reference Static Audit
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production field research shell
        run: |
          set -euo pipefail
          test -f field-reference-rollout-v6.css
          test -f index.html
          test -f sw.js
          python3 - <<'PY'
          from pathlib import Path
          html=Path("index.html").read_text()
          sw=Path("sw.js").read_text()
          css=Path("field-reference-rollout-v6.css").read_text()
          assert chr(92)+"n" not in html, "literal backslash-n found in index.html"
          assert '<link rel="stylesheet" href="./field-reference-rollout-v6.css">' in html
          assert '<script src="./app-field-reference-v2.js"></script>' in html
          assert '<script src="./field-target-ui-v5.js"></script>' in html
          assert "'./field-target-ui-v5.js'" in sw
          assert 'field-reference-v5.js' not in html
          assert 'field-reference-v12.css' not in html
          assert 'field-carousel-v25.css' not in html
          assert "'./field-reference-rollout-v6.css'" in sw
          assert "'./app-field-reference-v2.js'" in sw
          assert "slopro-public-shell-v49-carousel-runtime-diagnostic" in sw
          assert "calc(66.6667% - 4px)" in css
          assert "scroll-snap-type:x mandatory" in css
          assert "scroll-snap-stop:normal" in css
          assert "touch-action:pan-x pan-y" in css
          assert ".fr-morning" in css and ".at-matrix" in css
          assert ".fr-rail-machine" in css and ".field-machine-main" in css
          app=Path("app-field-reference-v2.js").read_text()
          assert "fr-rail-machine" in app and "pwa-field-reference-api" in app
          assert "スルー" not in css, "decision/source text must not be hardcoded in presentation CSS"
          print("FIELD_REFERENCE_STATIC_AUDIT_OK")
          PY
